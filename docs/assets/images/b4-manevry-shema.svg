<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="'Manrope', -apple-system, 'Segoe UI', Roboto, Arial, 'Liberation Sans', sans-serif" role="img" aria-label="Упрощённая схема шести манёвров первого этапа практического экзамена, вид сверху">
  <rect width="1200" height="900" fill="#F7F7F5"/>

  <text x="600" y="46" text-anchor="middle" font-size="28" font-weight="800" fill="#181818">Шесть манёвров первого этапа</text>
  <text x="600" y="74" text-anchor="middle" font-size="16" fill="#686868">Упрощённая схема без масштаба — п. 30 «а» Правил допуска (ПП № 796)</text>

  <!-- shared defs -->
  <defs>
    <marker id="arrB4" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#FF6A00"/>
    </marker>
    <marker id="arrB4dark" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#181818"/>
    </marker>
  </defs>

  <!-- ============ CELL TEMPLATE: 360x236, cols x=40/420/800, rows y=110/376 ============ -->

  <!-- Cell 1: Начало движения на подъёме -->
  <g transform="translate(40,110)">
    <rect width="360" height="236" rx="12" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1.5"/>
    <text x="20" y="30" font-size="13" font-weight="700" fill="#181818">1 · Начало движения на подъёме</text>
    <!-- icon: incline -->
    <line x1="70" y1="150" x2="270" y2="70" stroke="#C9C7C0" stroke-width="14" stroke-linecap="round"/>
    <g transform="translate(140,127) rotate(-20)">
      <rect x="-23" y="-11" width="46" height="22" rx="4" fill="#181818"/>
      <rect x="4" y="-16" width="14" height="12" rx="2" fill="#3A3A3A"/>
    </g>
    <path d="M 168 116 L 235 82" stroke="#FF6A00" stroke-width="3" marker-end="url(#arrB4)"/>
    <text x="180" y="192" text-anchor="middle" font-size="12" fill="#686868">без отката и рывка</text>
    <rect x="20" y="206" width="150" height="20" rx="10" fill="#F0EFEB"/>
    <text x="95" y="220" text-anchor="middle" font-size="10.5" font-weight="700" fill="#686868">без исключений</text>
  </g>

  <!-- Cell 2: Разворот при ограниченной ширине -->
  <g transform="translate(420,110)">
    <rect width="360" height="236" rx="12" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1.5"/>
    <text x="20" y="30" font-size="13" font-weight="700" fill="#181818">2 · Разворот на узком участке</text>
    <line x1="90" y1="60" x2="90" y2="150" stroke="#C9C7C0" stroke-width="3" stroke-dasharray="6 6"/>
    <line x1="270" y1="60" x2="270" y2="150" stroke="#C9C7C0" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M 130 75 C 90 100, 90 130, 130 145 C 170 160, 230 155, 240 110 C 246 85, 220 68, 190 75" fill="none" stroke="#FF6A00" stroke-width="3" marker-end="url(#arrB4)"/>
    <g transform="translate(130,75) rotate(30)">
      <rect x="-19" y="-9" width="38" height="18" rx="4" fill="#181818"/>
    </g>
    <text x="180" y="192" text-anchor="middle" font-size="12" fill="#686868">одноразовое включение передачи</text>
    <rect x="14" y="206" width="332" height="20" rx="10" fill="#F0EFEB"/>
    <text x="180" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#686868">не для гусеничных и фрикционных колёсных</text>
  </g>

  <!-- Cell 3: Постановка в бокс задним ходом -->
  <g transform="translate(800,110)">
    <rect width="360" height="236" rx="12" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1.5"/>
    <text x="20" y="30" font-size="13" font-weight="700" fill="#181818">3 · Бокс задним ходом</text>
    <rect x="210" y="58" width="90" height="80" fill="none" stroke="#181818" stroke-width="3"/>
    <g transform="translate(255,98)">
      <rect x="-19" y="-9" width="38" height="18" rx="4" fill="#181818"/>
    </g>
    <path d="M 110 160 C 160 150, 200 130, 245 108" fill="none" stroke="#FF6A00" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrB4)"/>
    <g transform="translate(100,163) rotate(-14)">
      <rect x="-19" y="-9" width="38" height="18" rx="4" fill="#8C4A00" opacity="0.85"/>
    </g>
    <text x="180" y="192" text-anchor="middle" font-size="12" fill="#686868">точность манёвра задним ходом</text>
    <rect x="20" y="206" width="150" height="20" rx="10" fill="#F0EFEB"/>
    <text x="95" y="220" text-anchor="middle" font-size="10.5" font-weight="700" fill="#686868">без исключений</text>
  </g>

  <!-- Cell 4: Постановка в бокс с прицепом -->
  <g transform="translate(40,376)">
    <rect width="360" height="236" rx="12" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1.5"/>
    <text x="20" y="30" font-size="13" font-weight="700" fill="#181818">4 · Бокс с прицепом, задним ходом</text>
    <rect x="220" y="58" width="90" height="80" fill="none" stroke="#181818" stroke-width="3"/>
    <g transform="translate(263,98)">
      <rect x="-16" y="-9" width="32" height="18" rx="4" fill="#181818"/>
    </g>
    <path d="M 95 160 C 150 150, 195 130, 250 108" fill="none" stroke="#FF6A00" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrB4)"/>
    <g transform="translate(85,163) rotate(-12)">
      <rect x="-17" y="-9" width="34" height="18" rx="4" fill="#8C4A00" opacity="0.85"/>
      <circle cx="-30" cy="0" r="2.5" fill="#8C4A00"/>
      <rect x="-52" y="-8" width="20" height="16" rx="3" fill="#B9B6AE"/>
    </g>
    <text x="180" y="192" text-anchor="middle" font-size="12" fill="#686868">сложнее — прицеп в сцепке</text>
    <rect x="10" y="206" width="340" height="20" rx="10" fill="#F0EFEB"/>
    <text x="180" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#686868">не для категорий A I, A IV, F</text>
  </g>

  <!-- Cell 5: Агрегатирование с навесной машиной -->
  <g transform="translate(420,376)">
    <rect width="360" height="236" rx="12" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1.5"/>
    <text x="20" y="30" font-size="13" font-weight="700" fill="#181818">5 · Агрегатирование с навесной машиной</text>
    <g transform="translate(150,100)">
      <rect x="-23" y="-11" width="46" height="22" rx="4" fill="#181818"/>
    </g>
    <path d="M 173 100 L 210 100" stroke="#FF6A00" stroke-width="3" marker-end="url(#arrB4)"/>
    <path d="M 235 76 L 255 76 L 255 124 L 235 124 Z" fill="#B9B6AE" stroke="#686868" stroke-width="1.5"/>
    <text x="180" y="192" text-anchor="middle" font-size="12" fill="#686868">навеска оборудования на машину</text>
    <rect x="14" y="206" width="332" height="20" rx="10" fill="#F0EFEB"/>
    <text x="180" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#686868">не для категорий A I и F</text>
  </g>

  <!-- Cell 6: Агрегатирование с прицепом -->
  <g transform="translate(800,376)">
    <rect width="360" height="236" rx="12" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1.5"/>
    <text x="20" y="30" font-size="13" font-weight="700" fill="#181818">6 · Агрегатирование с прицепом</text>
    <g transform="translate(130,100)">
      <rect x="-23" y="-11" width="46" height="22" rx="4" fill="#181818"/>
    </g>
    <circle cx="168" cy="100" r="3" fill="#8C4A00"/>
    <path d="M 171 100 L 205 100" stroke="#FF6A00" stroke-width="3" marker-end="url(#arrB4)"/>
    <rect x="228" y="82" width="55" height="36" rx="4" fill="#B9B6AE" stroke="#686868" stroke-width="1.5"/>
    <text x="180" y="192" text-anchor="middle" font-size="12" fill="#686868">сцепка с прицепным оборудованием</text>
    <rect x="10" y="206" width="340" height="20" rx="10" fill="#F0EFEB"/>
    <text x="180" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#686868">не для категорий A I, A IV, F</text>
  </g>

  <!-- footer: braking, separate skill -->
  <rect x="40" y="646" width="1120" height="74" rx="12" fill="#181818"/>
  <text x="70" y="678" font-size="14.5" font-weight="700" fill="#F3F1EC">Отдельно проверяют торможение и остановку на разных скоростях, включая экстренную</text>
  <text x="70" y="700" font-size="13" fill="#B9B6AE">Тот же подпункт «а» п. 30 — но это навык контроля скорости, а не траектория движения. Без исключений по категориям.</text>

  <text x="600" y="756" text-anchor="middle" font-size="13.5" fill="#686868">Точная траектория и разметка задаются конкретной площадкой — здесь показан только состав манёвров и логика исключений</text>
</svg>
