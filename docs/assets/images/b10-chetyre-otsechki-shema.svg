<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="'Manrope', -apple-system, 'Segoe UI', Roboto, Arial, 'Liberation Sans', sans-serif" role="img" aria-label="Схема: четыре даты-отсечки старых документов и общий исход — замена без экзаменов">
  <rect width="1200" height="780" fill="#F7F7F5"/>

  <text x="600" y="46" text-anchor="middle" font-size="27" font-weight="800" fill="#181818">Четыре старых документа — один исход</text>
  <text x="600" y="74" text-anchor="middle" font-size="15.5" fill="#686868">Дата — точная граница: документ на день позже отсечки идёт по обычному порядку</text>

  <defs>
    <marker id="arrowB10" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2E7D4F"/>
    </marker>
  </defs>

  <!-- scope note -->
  <rect x="40" y="92" width="1120" height="54" rx="10" fill="#FFFFFF" stroke="#C9C7C0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="600" y="114" text-anchor="middle" font-size="13" fill="#686868">Это про старые документы, а не про действующее сейчас иностранное национальное удостоверение —</text>
  <text x="600" y="134" text-anchor="middle" font-size="13" fill="#686868">для него правило другое: пересдаётся только теория, а сам документ возвращают владельцу</text>

  <!-- Card 1 -->
  <g>
    <rect x="36" y="170" width="264" height="220" rx="14" fill="#FFFFFF" stroke="#181818" stroke-width="1.5"/>
    <rect x="66" y="192" width="204" height="40" rx="10" fill="#181818"/>
    <text x="168" y="218" text-anchor="middle" font-size="15" font-weight="800" fill="#F3F1EC">до 01.01.1991</text>
    <text x="168" y="260" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">Удостоверение самоходных</text>
    <text x="168" y="280" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">машин, выданное в республиках</text>
    <text x="168" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">бывшего СССР</text>
    <text x="168" y="352" text-anchor="middle" font-size="11.5" fill="#9A9890">п. 42, абз. 1 Правил допуска</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="324" y="170" width="264" height="220" rx="14" fill="#FFFFFF" stroke="#181818" stroke-width="1.5"/>
    <rect x="354" y="192" width="204" height="40" rx="10" fill="#181818"/>
    <text x="456" y="218" text-anchor="middle" font-size="15" font-weight="800" fill="#F3F1EC">до 01.01.2000</text>
    <text x="456" y="264" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">Удостоверение самоходных</text>
    <text x="456" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">машин, выданное на территории</text>
    <text x="456" y="304" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">Российской Федерации</text>
    <text x="456" y="352" text-anchor="middle" font-size="11.5" fill="#9A9890">п. 42, абз. 1 Правил допуска</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="612" y="170" width="264" height="220" rx="14" fill="#FFFFFF" stroke="#181818" stroke-width="1.5"/>
    <rect x="642" y="192" width="204" height="40" rx="10" fill="#181818"/>
    <text x="744" y="218" text-anchor="middle" font-size="15" font-weight="800" fill="#F3F1EC">до 14.11.2011</text>
    <text x="744" y="256" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">Техника с электродвигателем</text>
    <text x="744" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">свыше 4 кВт или внедорожные</text>
    <text x="744" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">АТС, выданные в России</text>
    <text x="744" y="320" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8C4A00">+ копия допуска к работе</text>
    <text x="744" y="352" text-anchor="middle" font-size="11.5" fill="#9A9890">п. 42, абз. 1–2 Правил допуска</text>
  </g>

  <!-- Card 4 -->
  <g>
    <rect x="900" y="170" width="264" height="220" rx="14" fill="#FFFFFF" stroke="#181818" stroke-width="1.5"/>
    <rect x="930" y="192" width="204" height="40" rx="10" fill="#181818"/>
    <text x="1032" y="218" text-anchor="middle" font-size="15" font-weight="800" fill="#F3F1EC">до 18.03.2014</text>
    <text x="1032" y="260" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">Удостоверение по законам</text>
    <text x="1032" y="280" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">Украины — для принявших</text>
    <text x="1032" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#201F1C">гражданство РФ по Крыму</text>
    <text x="1032" y="352" text-anchor="middle" font-size="11.5" fill="#9A9890">п. 42, абз. 1 Правил допуска</text>
  </g>

  <!-- Converging connectors -->
  <path d="M 168,390 C 168,430 400,440 560,462" fill="none" stroke="#2E7D4F" stroke-width="2.5" marker-end="url(#arrowB10)"/>
  <path d="M 456,390 C 456,420 520,432 580,458" fill="none" stroke="#2E7D4F" stroke-width="2.5" marker-end="url(#arrowB10)"/>
  <path d="M 744,390 C 744,420 680,432 620,458" fill="none" stroke="#2E7D4F" stroke-width="2.5" marker-end="url(#arrowB10)"/>
  <path d="M 1032,390 C 1032,430 800,440 640,462" fill="none" stroke="#2E7D4F" stroke-width="2.5" marker-end="url(#arrowB10)"/>

  <!-- Outcome box -->
  <rect x="260" y="470" width="680" height="180" rx="16" fill="#E9F4EE" stroke="#2E7D4F" stroke-width="2"/>
  <text x="600" y="512" text-anchor="middle" font-size="21" font-weight="800" fill="#1E5E3B">Без экзаменов</text>
  <line x1="330" y1="530" x2="870" y2="530" stroke="#BFE0CE" stroke-width="1.5"/>
  <text x="600" y="558" text-anchor="middle" font-size="14" fill="#1E5E3B">Меняют на удостоверение тракториста-машиниста без пересдачи</text>
  <text x="600" y="578" text-anchor="middle" font-size="14" fill="#1E5E3B">теории и практики (п. 42)</text>
  <text x="600" y="608" text-anchor="middle" font-size="14" fill="#1E5E3B">Старый документ не возвращают — изымают и сдают</text>
  <text x="600" y="628" text-anchor="middle" font-size="14" fill="#1E5E3B">в гостехнадзор для уничтожения (п. 45)</text>

  <text x="600" y="700" text-anchor="middle" font-size="13.5" fill="#686868">Даты нужно понимать буквально: документ, выданный на день позже отсечки, под это правило не подпадает</text>
  <text x="600" y="724" text-anchor="middle" font-size="13.5" fill="#686868">и идёт по обычной процедуре — с обучением и полным набором экзаменов</text>
</svg>
