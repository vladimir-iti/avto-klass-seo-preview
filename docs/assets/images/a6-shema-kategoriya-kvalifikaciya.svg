<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="'Manrope', -apple-system, 'Segoe UI', Roboto, Arial, 'Liberation Sans', sans-serif" role="img" aria-label="Схема: категория самоходной машины определяет, чем управлять, квалификация — какие работы выполнять">
  <rect width="1200" height="700" fill="#F7F7F5"/>

  <text x="600" y="50" text-anchor="middle" font-size="28" font-weight="800" fill="#181818">Категория — это не квалификация</text>
  <text x="600" y="78" text-anchor="middle" font-size="16" fill="#686868">Два разных понятия удостоверения тракториста-машиниста (ПП № 796)</text>

  <!-- Left column: Category -->
  <rect x="80" y="120" width="480" height="90" rx="12" fill="#181818"/>
  <text x="320" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#B9B6AE" letter-spacing="0.5">БУКВА В УДОСТОВЕРЕНИИ</text>
  <text x="320" y="188" text-anchor="middle" font-size="21" font-weight="800" fill="#F3F1EC">Категория (B, C, D, E, F…)</text>

  <path d="M 320 210 L 320 244" stroke="#201F1C" stroke-width="3" marker-end="url(#arrowDark)"/>

  <rect x="80" y="244" width="480" height="124" rx="12" fill="#FFFFFF" stroke="#201F1C" stroke-width="2"/>
  <text x="320" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#201F1C">Отвечает на вопрос:</text>
  <text x="320" y="304" text-anchor="middle" font-size="19" font-weight="800" fill="#201F1C">«Какую машину можно вести»</text>
  <text x="320" y="330" text-anchor="middle" font-size="13.5" fill="#686868">определяется мощностью, типом хода</text>
  <text x="320" y="348" text-anchor="middle" font-size="13.5" fill="#686868">или назначением техники</text>

  <!-- Right column: Qualification -->
  <rect x="640" y="120" width="480" height="90" rx="12" fill="#FF6A00"/>
  <text x="880" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF3E8" letter-spacing="0.5">ГРАФА «ОСОБЫЕ ОТМЕТКИ»</text>
  <text x="880" y="188" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">Квалификация («тракторист-машинист»)</text>

  <path d="M 880 210 L 880 244" stroke="#B15A00" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <rect x="640" y="244" width="480" height="124" rx="12" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2"/>
  <text x="880" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#B15A00">Отвечает на вопрос:</text>
  <text x="880" y="304" text-anchor="middle" font-size="19" font-weight="800" fill="#B15A00">«Какие работы можно выполнять»</text>
  <text x="880" y="330" text-anchor="middle" font-size="13.5" fill="#686868">сверх собственно управления машиной —</text>
  <text x="880" y="348" text-anchor="middle" font-size="13.5" fill="#686868">вносится по документу о квалификации</text>

  <defs>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#201F1C"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B15A00"/>
    </marker>
  </defs>

  <!-- Connector showing independence -->
  <path d="M 560 299 L 640 299" stroke="#C9C7C0" stroke-width="2.5" stroke-dasharray="5 5"/>
  <circle cx="600" cy="299" r="16" fill="#F7F7F5" stroke="#C9C7C0" stroke-width="2"/>
  <text x="600" y="304" text-anchor="middle" font-size="14" font-weight="800" fill="#686868">≠</text>

  <!-- Example strip -->
  <rect x="80" y="400" width="1040" height="130" rx="12" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1.5"/>
  <text x="110" y="432" font-size="15" font-weight="700" fill="#201F1C">Пример на категории F</text>
  <text x="110" y="462" font-size="14.5" fill="#686868">Категория F — управление самоходными сельскохозяйственными машинами (например, комбайном).</text>
  <text x="110" y="486" font-size="14.5" fill="#686868">Профессия «тракторист-машинист сельскохозяйственного производства» по программам Минсельхоза</text>
  <text x="110" y="510" font-size="14.5" fill="#686868">готовит сразу по пяти категориям — B, C, D, E и F, а не только по F.</text>

  <!-- Bottom note -->
  <rect x="80" y="556" width="1040" height="90" rx="12" fill="#F0EFEB"/>
  <text x="110" y="586" font-size="14.5" fill="#201F1C" font-weight="600">При открытых категориях B, C, D, E доп. запись для работ по квалификации тракториста не нужна.</text>
  <text x="110" y="612" font-size="14.5" fill="#201F1C" font-weight="600">И наоборот: без удостоверения тракториста квалификация не лишает права на работы,</text>
  <text x="110" y="634" font-size="14.5" fill="#201F1C" font-weight="600">не связанные с управлением машиной (п. 6, 8 Правил допуска).</text>
</svg>
