<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="'Manrope', -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Схема: два направления работы органа гостехнадзора — допуск людей и учёт техники">
  <rect width="1200" height="660" fill="#F7F7F5"/>

  <text x="600" y="50" text-anchor="middle" font-size="28" font-weight="800" fill="#181818">Одно ведомство — два разных направления</text>
  <text x="600" y="78" text-anchor="middle" font-size="16" fill="#686868">Инспекция гостехнадзора занимается и тем, и другим — но это разные услуги</text>

  <!-- Hub -->
  <rect x="400" y="108" width="400" height="64" rx="12" fill="#181818"/>
  <text x="600" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#F3F1EC">Инспекция гостехнадзора Пермского края</text>

  <!-- Diagonal connectors -->
  <path d="M 470 172 L 320 224" fill="none" stroke="#B15A00" stroke-width="3"/>
  <path d="M 730 172 L 880 224" fill="none" stroke="#C9C7C0" stroke-width="3"/>

  <!-- Left card: active, this series -->
  <rect x="90" y="224" width="460" height="336" rx="16" fill="#FFFFFF" stroke="#B15A00" stroke-width="2.5"/>
  <rect x="90" y="224" width="460" height="78" rx="16" fill="#FF6A00"/>
  <rect x="90" y="270" width="460" height="32" fill="#FF6A00"/>
  <text x="320" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF3E8" letter-spacing="0.4">НАПРАВЛЕНИЕ 1</text>
  <text x="320" y="284" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">Допуск людей к управлению</text>

  <g font-size="15" fill="#201F1C">
    <circle cx="128" cy="330" r="4" fill="#B15A00"/>
    <text x="146" y="336">Приём экзаменов — теория и практика</text>
    <circle cx="128" cy="366" r="4" fill="#B15A00"/>
    <text x="146" y="372">Выдача удостоверения тракториста-машиниста</text>
    <circle cx="128" cy="402" r="4" fill="#B15A00"/>
    <text x="146" y="408">Замена — по истечении срока, при утрате</text>
    <circle cx="128" cy="438" r="4" fill="#B15A00"/>
    <text x="146" y="444">Возврат после лишения права управления</text>
  </g>

  <text x="320" y="486" text-anchor="middle" font-size="13.5" fill="#686868">Регулирует Постановление Правительства РФ № 796</text>

  <rect x="130" y="504" width="380" height="40" rx="20" fill="#FDF0E4"/>
  <text x="320" y="529" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8C4A00">Тема этой серии статей</text>

  <!-- Right card: out of scope -->
  <rect x="650" y="224" width="460" height="336" rx="16" fill="#FFFFFF" stroke="#C9C7C0" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="650" y="224" width="460" height="78" rx="16" fill="#EDECE7"/>
  <rect x="650" y="270" width="460" height="32" fill="#EDECE7"/>
  <text x="880" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#8C8A82" letter-spacing="0.4">НАПРАВЛЕНИЕ 2</text>
  <text x="880" y="284" text-anchor="middle" font-size="19" font-weight="800" fill="#4A4A46">Учёт самой техники</text>

  <g font-size="15" fill="#4A4A46">
    <circle cx="688" cy="330" r="4" fill="#9A9890"/>
    <text x="706" y="336">Государственная регистрация машин и прицепов</text>
    <circle cx="688" cy="366" r="4" fill="#9A9890"/>
    <text x="706" y="372">Технический осмотр самоходных машин</text>
  </g>

  <text x="880" y="486" text-anchor="middle" font-size="13.5" fill="#8C8A82">Регулирует Постановление Правительства РФ № 1507</text>

  <rect x="690" y="504" width="380" height="40" rx="20" fill="#EDECE7"/>
  <text x="880" y="529" text-anchor="middle" font-size="13.5" font-weight="700" fill="#68665F">Отдельная услуга — не в этой серии статей</text>

  <text x="600" y="612" text-anchor="middle" font-size="13.5" fill="#9A9890">Одно ведомство, но разные заявления, сроки и, вероятно, разные специалисты внутри него</text>
</svg>
