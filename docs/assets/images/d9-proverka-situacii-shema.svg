<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="'Manrope', -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Схема: как проверить, нужны ли права тракториста на конкретную технику">
  <rect width="1200" height="460" fill="#F7F7F5"/>

  <text x="600" y="46" text-anchor="middle" font-size="27" font-weight="800" fill="#181818">Проверка своей ситуации за три шага</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#686868">Три вопроса подряд — ответ не зависит от места использования техники</text>

  <!-- Step 1 -->
  <rect x="60" y="112" width="320" height="180" rx="14" fill="#181818"/>
  <circle cx="104" cy="152" r="20" fill="none" stroke="#B9B6AE" stroke-width="2.5"/>
  <text x="104" y="158" text-anchor="middle" font-size="16" font-weight="800" fill="#B9B6AE">1</text>
  <text x="134" y="158" font-size="13" font-weight="700" fill="#B9B6AE" letter-spacing="0.3">ТИП ТЕХНИКИ</text>
  <text x="94" y="196" font-size="16.5" font-weight="700" fill="#F3F1EC">Определите объективно:</text>
  <text x="94" y="220" font-size="14.5" fill="#DAD8D1">мощность двигателя, тип хода,</text>
  <text x="94" y="242" font-size="14.5" fill="#DAD8D1">есть ли сиденье — а не по</text>
  <text x="94" y="264" font-size="14.5" fill="#DAD8D1">бытовому названию машины</text>

  <path d="M 380 202 L 424 202" stroke="#201F1C" stroke-width="2.5" marker-end="url(#arrowD9b)"/>

  <!-- Step 2 -->
  <rect x="424" y="112" width="320" height="180" rx="14" fill="#FDF0E4" stroke="#B15A00" stroke-width="2"/>
  <circle cx="468" cy="152" r="20" fill="none" stroke="#B15A00" stroke-width="2.5"/>
  <text x="468" y="158" text-anchor="middle" font-size="16" font-weight="800" fill="#B15A00">2</text>
  <text x="498" y="158" font-size="13" font-weight="700" fill="#B15A00" letter-spacing="0.3">ПОРОГ РЕГИСТРАЦИИ</text>
  <text x="458" y="196" font-size="16.5" font-weight="700" fill="#8C4A00">Проверьте порог:</text>
  <text x="458" y="220" font-size="14.5" fill="#8C4A00">ДВС &gt; 50 см³ или</text>
  <text x="458" y="242" font-size="14.5" fill="#8C4A00">электродвигатель &gt; 4 кВт</text>
  <text x="458" y="264" font-size="13" fill="#B37A3D">(ПП № 1507, п. 1)</text>

  <path d="M 744 202 L 788 202" stroke="#201F1C" stroke-width="2.5" marker-end="url(#arrowD9b)"/>

  <!-- Step 3 -->
  <rect x="788" y="112" width="352" height="180" rx="14" fill="#E9F4EE" stroke="#2E7D4F" stroke-width="2"/>
  <circle cx="832" cy="152" r="20" fill="none" stroke="#2E7D4F" stroke-width="2.5"/>
  <text x="832" y="158" text-anchor="middle" font-size="16" font-weight="800" fill="#2E7D4F">3</text>
  <text x="862" y="158" font-size="13" font-weight="700" fill="#1E5E3B" letter-spacing="0.3">КАТЕГОРИЯ И УПРАВЛЯЮЩИЙ</text>
  <text x="822" y="196" font-size="16.5" font-weight="700" fill="#1E5E3B">Убедитесь, что за</text>
  <text x="822" y="220" font-size="14.5" fill="#1E5E3B">рычагами — человек с нужной</text>
  <text x="822" y="242" font-size="14.5" fill="#1E5E3B">категорией, независимо от</text>
  <text x="822" y="264" font-size="14.5" fill="#1E5E3B">того, чья это машина и земля</text>

  <defs>
    <marker id="arrowD9b" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#201F1C"/>
    </marker>
  </defs>

  <rect x="150" y="340" width="900" height="80" rx="12" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1.5"/>
  <text x="600" y="374" text-anchor="middle" font-size="14.5" font-weight="700" fill="#201F1C">Если порог из шага 2 не превышен — требование удостоверения, скорее всего, не применяется</text>
  <text x="600" y="398" text-anchor="middle" font-size="14.5" font-weight="700" fill="#201F1C">Если превышен — переходите к шагу 3, вне зависимости от места использования техники</text>
</svg>
