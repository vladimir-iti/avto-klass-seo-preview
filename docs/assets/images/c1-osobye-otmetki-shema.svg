<svg viewBox="0 0 1200 740" xmlns="http://www.w3.org/2000/svg" font-family="'Manrope', -apple-system, 'Segoe UI', Roboto, Arial, 'Liberation Sans', sans-serif" role="img" aria-label="Схема: графа «Особые отметки» в удостоверении тракториста-машиниста и три типа записей в ней">
  <rect width="1200" height="740" fill="#F7F7F5"/>

  <text x="600" y="46" text-anchor="middle" font-size="28" font-weight="800" fill="#181818">Одна графа — три разных типа записи</text>
  <text x="600" y="74" text-anchor="middle" font-size="16" fill="#686868">«Особые отметки» в удостоверении тракториста-машиниста (пункт 6 Правил допуска)</text>

  <!-- document card, folded corner -->
  <g transform="translate(90,116)">
    <path d="M 0,0 L 320,0 L 320,470 L 60,470 L 0,410 Z" fill="#FFFFFF" stroke="#181818" stroke-width="2"/>
    <path d="M 0,0 L 0,410 L 60,470 L 60,60 Z" fill="#F0EFEB" stroke="#181818" stroke-width="2"/>

    <rect x="0" y="0" width="320" height="64" fill="#181818"/>
    <text x="160" y="27" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B9B6AE" letter-spacing="0.4">УДОСТОВЕРЕНИЕ</text>
    <text x="160" y="47" text-anchor="middle" font-size="14.5" font-weight="800" fill="#F3F1EC">ТРАКТОРИСТА-МАШИНИСТА</text>

    <rect x="90" y="90" width="200" height="14" rx="4" fill="#E5E5E1"/>
    <text x="90" y="80" font-size="11.5" fill="#9A9890">Фамилия, имя, отчество</text>

    <text x="90" y="128" font-size="11.5" fill="#9A9890">Категории</text>
    <rect x="90" y="138" width="140" height="14" rx="4" fill="#E5E5E1"/>

    <text x="90" y="176" font-size="11.5" fill="#9A9890">Дата выдачи</text>
    <rect x="90" y="186" width="110" height="14" rx="4" fill="#E5E5E1"/>

    <line x1="90" y1="222" x2="290" y2="222" stroke="#E5E5E1" stroke-width="1.5"/>

    <!-- highlighted field -->
    <rect x="90" y="248" width="200" height="120" rx="10" fill="#FDF0E4" stroke="#B15A00" stroke-width="2.5"/>
    <text x="190" y="274" text-anchor="middle" font-size="13" font-weight="800" fill="#8C4A00">ОСОБЫЕ</text>
    <text x="190" y="292" text-anchor="middle" font-size="13" font-weight="800" fill="#8C4A00">ОТМЕТКИ</text>
    <rect x="106" y="308" width="168" height="10" rx="3" fill="#F3D9BC"/>
    <rect x="106" y="326" width="140" height="10" rx="3" fill="#F3D9BC"/>
    <rect x="106" y="344" width="152" height="10" rx="3" fill="#F3D9BC"/>
  </g>

  <!-- leader lines from highlighted field to three cards -->
  <path d="M 480 340 L 560 236" fill="none" stroke="#C9C7C0" stroke-width="2"/>
  <path d="M 480 364 L 560 388" fill="none" stroke="#C9C7C0" stroke-width="2"/>
  <path d="M 480 388 L 560 540" fill="none" stroke="#C9C7C0" stroke-width="2"/>

  <!-- card 1: разрешительная -->
  <rect x="560" y="120" width="550" height="116" rx="12" fill="#E9F4EE" stroke="#2E7D4F" stroke-width="2"/>
  <text x="588" y="150" font-size="15.5" font-weight="800" fill="#1E5E3B">РАЗРЕШИТЕЛЬНАЯ</text>
  <text x="588" y="176" font-size="13.5" fill="#1E5E3B">Даёт право на работу или квалификацию сверх того,</text>
  <text x="588" y="196" font-size="13.5" fill="#1E5E3B">что уже подразумевает открытая категория —</text>
  <text x="588" y="216" font-size="13.5" font-weight="700" fill="#1E5E3B">например, квалификация «тракторист-машинист»</text>

  <!-- card 2: ограничительная -->
  <rect x="560" y="272" width="550" height="116" rx="12" fill="#FDF0E4" stroke="#B15A00" stroke-width="2"/>
  <text x="588" y="302" font-size="15.5" font-weight="800" fill="#8C4A00">ОГРАНИЧИТЕЛЬНАЯ</text>
  <text x="588" y="328" font-size="13.5" fill="#8C4A00">Сужает уже имеющееся право — например, отметка</text>
  <text x="588" y="348" font-size="13.5" fill="#8C4A00">об обязательном управлении в очках или линзах,</text>
  <text x="588" y="368" font-size="13.5" font-weight="700" fill="#8C4A00">либо ограничение по конкретной квалификации</text>

  <!-- card 3: информационная -->
  <rect x="560" y="424" width="550" height="116" rx="12" fill="#FFFFFF" stroke="#201F1C" stroke-width="1.5"/>
  <text x="588" y="454" font-size="15.5" font-weight="800" fill="#201F1C">ИНФОРМАЦИОННАЯ</text>
  <text x="588" y="480" font-size="13.5" fill="#4A4A46">Не разрешает и не ограничивает, а только фиксирует</text>
  <text x="588" y="500" font-size="13.5" fill="#4A4A46">сведения — например, стаж работы или</text>
  <text x="588" y="520" font-size="13.5" font-weight="700" fill="#4A4A46">группу крови</text>

  <text x="600" y="606" text-anchor="middle" font-size="13.5" fill="#686868">Схематичный макет графы — не копия бланка и не содержит чьих-либо персональных данных</text>
  <text x="600" y="628" text-anchor="middle" font-size="13.5" fill="#686868">Основание для разрешительной и ограничительной записи о квалификации — документ о квалификации (п. 7 Правил допуска)</text>
</svg>
