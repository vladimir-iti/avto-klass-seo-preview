<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="'Manrope', -apple-system, 'Segoe UI', Roboto, Arial, 'Liberation Sans', sans-serif" role="img" aria-label="Шкала возрастных порогов для категорий удостоверения тракториста: от 16 до 22 лет">
  <rect width="1200" height="560" fill="#F7F7F5"/>

  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="800" fill="#181818">Пять возрастных порогов вместо одного</text>
  <text x="600" y="80" text-anchor="middle" font-size="16" fill="#686868">п. 11 «а» Правил допуска (ПП № 796) — допуск к экзамену по категориям</text>

  <!-- baseline -->
  <line x1="120" y1="260" x2="1080" y2="260" stroke="#201F1C" stroke-width="3"/>
  <polygon points="1080,260 1064,251 1064,269" fill="#201F1C"/>

  <!-- 5 stops, evenly spaced -->
  <!-- x positions -->
  <!-- 16:200 17:390 18:580 19:770 22:960 -->

  <g>
    <circle cx="200" cy="260" r="10" fill="#2E7D4F"/>
    <line x1="200" y1="260" x2="200" y2="180" stroke="#2E7D4F" stroke-width="2.5"/>
    <rect x="110" y="120" width="180" height="60" rx="10" fill="#E9F4EE" stroke="#2E7D4F" stroke-width="2"/>
    <text x="200" y="144" text-anchor="middle" font-size="15" font-weight="800" fill="#1E5E3B">16 ЛЕТ</text>
    <text x="200" y="166" text-anchor="middle" font-size="14" fill="#1E5E3B">A I</text>
    <text x="200" y="300" text-anchor="middle" font-size="13" fill="#686868">внедорожная</text>
    <text x="200" y="318" text-anchor="middle" font-size="13" fill="#686868">мототехника</text>
  </g>

  <g>
    <circle cx="390" cy="260" r="10" fill="#FF6A00"/>
    <line x1="390" y1="260" x2="390" y2="180" stroke="#FF6A00" stroke-width="2.5"/>
    <rect x="290" y="120" width="200" height="60" rx="10" fill="#FDF0E4" stroke="#FF6A00" stroke-width="2"/>
    <text x="390" y="144" text-anchor="middle" font-size="15" font-weight="800" fill="#B15A00">17 ЛЕТ</text>
    <text x="390" y="166" text-anchor="middle" font-size="14" fill="#B15A00">B, C, E, F</text>
    <text x="390" y="300" text-anchor="middle" font-size="13" fill="#686868">основная масса</text>
    <text x="390" y="318" text-anchor="middle" font-size="13" fill="#686868">тракторной техники</text>
  </g>

  <g>
    <circle cx="580" cy="260" r="10" fill="#181818"/>
    <line x1="580" y1="260" x2="580" y2="340" stroke="#181818" stroke-width="2.5"/>
    <line x1="580" y1="226" x2="580" y2="260" stroke="#181818" stroke-width="2"/>
    <rect x="490" y="340" width="180" height="60" rx="10" fill="#181818"/>
    <text x="580" y="364" text-anchor="middle" font-size="15" font-weight="800" fill="#F3F1EC">18 ЛЕТ</text>
    <text x="580" y="386" text-anchor="middle" font-size="14" fill="#F3F1EC">D</text>
    <text x="580" y="202" text-anchor="middle" font-size="13" fill="#686868">свыше 110,3 кВт —</text>
    <text x="580" y="220" text-anchor="middle" font-size="13" fill="#686868">самые мощные колёсные</text>
  </g>

  <g>
    <circle cx="770" cy="260" r="10" fill="#B15A00"/>
    <line x1="770" y1="260" x2="770" y2="180" stroke="#B15A00" stroke-width="2.5"/>
    <rect x="670" y="120" width="200" height="60" rx="10" fill="#FDF0E4" stroke="#B15A00" stroke-width="2"/>
    <text x="770" y="144" text-anchor="middle" font-size="15" font-weight="800" fill="#8C4A00">19 ЛЕТ</text>
    <text x="770" y="166" text-anchor="middle" font-size="14" fill="#8C4A00">A II, A III</text>
    <text x="770" y="300" text-anchor="middle" font-size="13" fill="#686868">плюс российское ВУ</text>
    <text x="770" y="318" text-anchor="middle" font-size="13" fill="#686868">и стаж от 12 мес.</text>
  </g>

  <g>
    <circle cx="960" cy="260" r="10" fill="#C43B2B"/>
    <line x1="960" y1="260" x2="960" y2="340" stroke="#C43B2B" stroke-width="2.5"/>
    <line x1="960" y1="226" x2="960" y2="260" stroke="#C43B2B" stroke-width="2"/>
    <rect x="870" y="340" width="180" height="60" rx="10" fill="#FBEAE7" stroke="#C43B2B" stroke-width="2"/>
    <text x="960" y="364" text-anchor="middle" font-size="15" font-weight="800" fill="#8C2A1E">22 ГОДА</text>
    <text x="960" y="386" text-anchor="middle" font-size="14" fill="#8C2A1E">A IV</text>
    <text x="960" y="202" text-anchor="middle" font-size="13" fill="#686868">пассажирские,</text>
    <text x="960" y="220" text-anchor="middle" font-size="13" fill="#686868">более 8 мест</text>
  </g>

  <!-- footnote -->
  <text x="600" y="470" text-anchor="middle" font-size="14.5" fill="#686868">Порог ограничивает допуск к сдаче экзамена, а не к самому обучению (п. 15¹ Правил допуска)</text>
  <text x="600" y="494" text-anchor="middle" font-size="14.5" fill="#686868">Для A II, A III, A IV возраст действует вместе с требованием о ВУ и стаже от 12 месяцев</text>
</svg>
